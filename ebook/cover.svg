<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
  <title id="title">The Human Advantage</title>
  <desc id="desc">A dark blue technology-inspired book cover with a luminous, connected orbital pattern and the subtitle A Practical Guide to AI, Technology, and the Future We Choose, by Cesar Pedrin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b2d"/>
      <stop offset="0.56" stop-color="#102c42"/>
      <stop offset="1" stop-color="#123c4b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#80e0d1" stop-opacity=".92"/>
      <stop offset="1" stop-color="#e4bb74" stop-opacity=".82"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#61cabb" stop-opacity=".22"/>
      <stop offset="1" stop-color="#61cabb" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="1800" fill="url(#bg)"/>
  <circle cx="820" cy="360" r="520" fill="url(#halo)"/>
  <g fill="none" stroke="#85cfc3" stroke-opacity=".17">
    <circle cx="820" cy="360" r="160" stroke-width="2"/>
    <circle cx="820" cy="360" r="265" stroke-width="2"/>
    <circle cx="820" cy="360" r="370" stroke-width="2"/>
    <path d="M420 0 1100 680M570 0 1200 630M1200 160 560 800M1200 5 745 455" stroke-width="2"/>
  </g>
  <g fill="url(#glow)" filter="url(#softGlow)">
    <circle cx="820" cy="360" r="10"/>
    <circle cx="820" cy="95" r="8"/>
    <circle cx="1050" cy="490" r="7"/>
    <circle cx="530" cy="565" r="8"/>
    <circle cx="1125" cy="225" r="7"/>
    <circle cx="685" cy="120" r="6"/>
  </g>
  <g fill="none" stroke="url(#glow)" stroke-width="3" stroke-opacity=".72">
    <path d="M530 565 820 360 1050 490M685 120 820 360 1125 225"/>
  </g>
  <path d="M105 610h94" stroke="#75d5c6" stroke-width="8" stroke-linecap="round"/>
  <text x="105" y="755" fill="#f4f7f5" font-family="Arial, Helvetica, sans-serif" font-size="102" font-weight="700" letter-spacing="-3">The Human</text>
  <text x="105" y="865" fill="#f4f7f5" font-family="Arial, Helvetica, sans-serif" font-size="102" font-weight="700" letter-spacing="-3">Advantage</text>
  <text x="110" y="970" fill="#b9d5d9" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400">A Practical Guide to AI, Technology,</text>
  <text x="110" y="1022" fill="#b9d5d9" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400">and the Future We Choose</text>
  <path d="M110 1435h980" stroke="#83bfc1" stroke-opacity=".45" stroke-width="2"/>
  <text x="110" y="1510" fill="#f3f5f0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" letter-spacing="3">BY CESAR PEDRIN</text>
  <text x="110" y="1680" fill="#9db9c1" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="2">A HUMAN-CENTERED GUIDE FOR A CHANGING WORLD</text>
</svg>
